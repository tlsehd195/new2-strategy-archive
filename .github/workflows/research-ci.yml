name: research-ci
# Verification of the research engine (run/discovery): compile, static checks,
# shell checks, config schemas, dependency scan and the full unit-test suite.
# Synthetic data and temp dirs only: no market data is downloaded, no research
# cycle runs, the locked-TEST ledger is never touched, nothing is deployed.
on:
  push:
    paths: ["run/**", ".github/workflows/research-ci.yml", "data/fill_ledger.jsonl"]
  pull_request:
    paths: ["run/**", ".github/workflows/research-ci.yml", "data/fill_ledger.jsonl"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Check out the NEW2 cost model (read-only dependency, pinned)
        uses: actions/checkout@v4
        with:
          repository: tlsehd195/NEW2
          ref: 8ec637153b4375143cbb9b34c00eb32053feca5e
          path: new2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q run/discovery
      - name: Static analysis (gating — syntax errors and undefined names)
        run: |
          python -m pip install --quiet "ruff==0.16.8"
          ruff check --isolated --select E9,F63,F7,F82 run/discovery
      - name: Static analysis (report only — pre-existing unused imports/variables are tracked in the audit report)
        continue-on-error: true
        run: ruff check --isolated --select F --statistics run/discovery
      - name: Shell syntax and ShellCheck
        run: |
          bash -n run/discovery/run_cycle.sh
          shellcheck run/discovery/run_cycle.sh
      - name: Config schemas
        working-directory: run/discovery
        env:
          COINTRADER_SRC: ${{ github.workspace }}/new2/src
        run: |
          python - <<'EOF'
          import json, sys
          sys.path.insert(0, ".")
          from pipeline import load_promotion_config
          from cost_calibration import load_criteria as cost_criteria
          from paper_forward import load_criteria as paper_criteria
          from costs_bridge import ASSUMED_PROFILES, load_assumed_profile
          load_promotion_config(); cost_criteria(); paper_criteria()
          for name in ASSUMED_PROFILES: load_assumed_profile(name)
          from public_cost_estimate import load_criteria as estimate_criteria
          estimate_criteria()
          json.load(open("data_exceptions.json"))
          print("configs ok")
          EOF
      - name: Dependency scan (runtime code must be stdlib-only)
        run: |
          python - <<'EOF'
          import ast, pathlib, sys
          local = {p.stem for p in pathlib.Path("run/discovery").rglob("*.py")}
          allowed = set(sys.stdlib_module_names) | local | {"cointrader"}
          legacy = {"funding_cost.py", "portfolio_sim.py"}   # v1 diagnostics, not used by the runner (README)
          bad = []
          for p in pathlib.Path("run/discovery").rglob("*.py"):
              if p.name in legacy:
                  continue
              for node in ast.walk(ast.parse(p.read_text())):
                  names = [a.name for a in node.names] if isinstance(node, ast.Import) else \
                          [node.module] if isinstance(node, ast.ImportFrom) and node.module and node.level == 0 else []
                  bad += [f"{p}: {n}" for n in names if n.split(".")[0] not in allowed]
          print("\n".join(bad) or "stdlib-only: ok")
          sys.exit(1 if bad else 0)
          EOF
      - name: Unit tests
        working-directory: run
        env:
          COINTRADER_SRC: ${{ github.workspace }}/new2/src
        run: python -m unittest discover -s discovery/tests -v 2>&1 | tail -n 40
        shell: bash -o pipefail {0}
